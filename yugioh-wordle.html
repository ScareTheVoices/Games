<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cardle</title>
<style>
:root{--bg:#120a24;--p1:#241442;--p2:#3a2468;--gold:#e6b93c;--gold2:#8a6a1c;--tx:#f3ecff;--mu:#a99bc9;--gr:#2e9e5b;--ye:#c9a227;--rd:#a8323e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 50% -10%,#3b1f70,#120a24 65%) fixed;color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:12px 12px 40px}
h1{margin:6px 0 2px;text-align:center;font:700 34px Georgia,'Times New Roman',serif;letter-spacing:.06em;color:var(--gold);text-shadow:0 2px 0 #4a3510,0 0 18px rgba(230,185,60,.35)}
.sub{text-align:center;color:var(--mu);font-size:13px;margin-bottom:10px}
button,select,input{font:inherit;color:var(--tx)}
button{cursor:pointer}
.stat{display:flex;justify-content:space-between;gap:6px;background:var(--p1);border:1px solid var(--gold2);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px;color:var(--mu)}
.stat b{color:var(--gold)}
.hints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.h{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--gold2);border-radius:8px;padding:8px 6px;min-height:58px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.h small{color:var(--mu);font-size:11px}
.h b{font-size:16px;overflow-wrap:anywhere}
.h.on{border-color:var(--gold);box-shadow:inset 0 0 12px rgba(230,185,60,.25)}
.h.on b{color:var(--gold)}
.h:disabled{cursor:default}
.h:not(.on):disabled{opacity:.45}
.h:not(.on):not(:disabled):hover{border-color:var(--gold)}
.acts{display:flex;gap:8px;margin:10px 0}
.btn{flex:1;padding:12px;border-radius:8px;border:1px solid var(--gold2);background:var(--p1);font-weight:600}
.btn.pri{background:linear-gradient(180deg,#f0c94f,#b88a1c);color:#2a1a04;border-color:#f0c94f}
.btn:disabled{opacity:.4;cursor:default}
.gr{background:var(--p1);border:1px solid #4a3480;border-radius:10px;padding:8px;margin-bottom:10px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.gh img{width:34px;height:34px;object-fit:cover;border-radius:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.t{border-radius:6px;padding:5px 4px;text-align:center;min-height:50px;display:flex;flex-direction:column;justify-content:center}
.t small{font-size:10.5px;opacity:.85}
.t b{font-size:14px;overflow-wrap:anywhere}
.t.g{background:var(--gr)}.t.y{background:var(--ye);color:#1f1602}.t.r{background:var(--rd)}
.end{text-align:center;background:var(--p1);border:2px solid var(--gold);border-radius:12px;padding:14px;margin-top:10px}
.end img{width:150px;border-radius:6px;margin:8px 0}
.end h2{margin:0;font:700 22px Georgia,serif;color:var(--gold)}
#load{text-align:center;padding:60px 10px;color:var(--mu)}
#load .bar{height:8px;background:var(--p1);border-radius:4px;overflow:hidden;margin:14px auto;max-width:300px}
#load .bar i{display:block;height:100%;width:0;background:var(--gold)}
#cat{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#cat[hidden],[hidden]{display:none!important}
.ch{padding:10px;background:var(--p1);border-bottom:1px solid var(--gold2);display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center}
.seg{display:flex;flex:1;border:1px solid var(--gold2);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:8px;background:transparent;border:0}
.seg button.on{background:var(--gold);color:#2a1a04;font-weight:700}
.ch input,.ch select{background:var(--bg);border:1px solid #4a3480;border-radius:8px;padding:8px;min-width:0}
.ch input#q{width:100%}
.sq{padding:8px 12px;background:var(--bg);border:1px solid #4a3480;border-radius:8px}
#cnt{margin-left:auto;color:var(--mu);font-size:12px;white-space:nowrap}
#fl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#fl label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:2px}
#fl .mm{display:flex;gap:4px}#fl .mm input{width:50%}
#list{flex:1;overflow-y:auto;padding:8px}
.it{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.it:hover{background:var(--p1);border-color:var(--gold2)}
.it img{width:52px;height:52px;object-fit:cover;border-radius:5px;background:var(--p2);flex:none}
.it b{display:block}.it small{color:var(--mu)}
.it.gd{opacity:.35;pointer-events:none}
.empty{text-align:center;color:var(--mu);padding:30px}
#cf{position:fixed;inset:0;background:rgba(5,2,12,.8);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#cf .box{background:var(--p1);border:2px solid var(--gold);border-radius:12px;padding:16px;text-align:center;max-width:320px;width:100%}
#cf img{width:140px;border-radius:6px}
#cf h3{margin:8px 0 2px;font:700 19px Georgia,serif;color:var(--gold)}
#cf small{color:var(--mu)}
</style></head><body>
<main>
<h1>CARDLE</h1>
<div class="sub">Guess the hidden Yu-Gi-Oh! monster</div>
<div id="load"><div id="lt">Loading monsters…</div><div class="bar"><i id="lb"></i></div></div>
<div id="game" hidden>
  <div class="stat" id="stat"></div>
  <div class="hints" id="hints"></div>
  <div class="acts"><button class="btn" id="rnd">Random hint</button><button class="btn pri" id="browse">Browse cards</button></div>
  <div id="guesses"></div>
  <div id="end"></div>
</div>
</main>

<div id="cat" hidden>
  <div class="ch">
    <div class="row"><div class="seg"><button data-m="match" class="on">Matching hints</button><button data-m="all">All cards</button></div><button class="sq" id="cx" aria-label="Close">✕</button></div>
    <input id="q" type="search" placeholder="Search by name">
    <div class="row">
      <select id="sort"><option value="name">Name</option><option value="atk">ATK</option><option value="def">DEF</option><option value="lv">Level/Rank/Link</option></select>
      <button class="sq" id="dir" aria-label="Sort direction">↑</button>
      <button class="sq" id="ft">Filters</button>
      <span id="cnt"></span>
    </div>
    <div id="fl" hidden>
      <label>Frame<select id="fr"></select></label>
      <label>Attribute<select id="at"></select></label>
      <label>Type<select id="ra"></select></label>
      <label>Level/Rank/Link<select id="lvf"></select></label>
      <label>ATK range<span class="mm"><input id="a1" type="number" placeholder="min"><input id="a2" type="number" placeholder="max"></span></label>
      <label>DEF range<span class="mm"><input id="d1" type="number" placeholder="min"><input id="d2" type="number" placeholder="max"></span></label>
    </div>
  </div>
  <div id="list"></div>
</div>
<div id="cf" hidden></div>

<script>
const API='https://db.ygoprodeck.com/api/v7/cardinfo.php';
const TYPES=['Normal Monster','Normal Tuner Monster','Effect Monster','Tuner Monster','Flip Effect Monster','Flip Tuner Effect Monster','Spirit Monster','Union Effect Monster','Gemini Monster','Toon Monster','Ritual Monster','Ritual Effect Monster','Pendulum Normal Monster','Pendulum Effect Monster','Pendulum Flip Effect Monster','Pendulum Tuner Effect Monster','Pendulum Effect Ritual Monster','Pendulum Effect Fusion Monster','Fusion Monster','Synchro Monster','Synchro Tuner Monster','Synchro Pendulum Effect Monster','XYZ Monster','XYZ Pendulum Effect Monster','Link Monster'];
const KEYS=['frame','lv','attr','race','atk','def'];
const LBL={frame:'Frame',lv:'Level/Rank/Link',attr:'Attribute',race:'Type',atk:'ATK',def:'DEF'};
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>v==null?'—':v===-1?'?':v;

function frameOf(t){
  if(t.includes('Link'))return'Link';
  if(t.includes('XYZ'))return'XYZ';
  if(t.includes('Synchro'))return'Synchro';
  if(t.includes('Fusion'))return'Fusion';
  if(t.includes('Ritual'))return'Ritual';
  if(t.includes('Normal'))return'Normal';
  return'Effect';
}
function slim(c){
  const f=frameOf(c.type),lk=f==='Link',im=(c.card_images&&c.card_images[0])||{};
  return{id:c.id,name:c.name,frame:f,lv:(lk?c.linkval:c.level)||0,attr:c.attribute,race:c.race,
    atk:c.atk==null?-1:c.atk,def:lk?null:(c.def==null?-1:c.def),
    img:im.image_url_small||im.image_url,art:im.image_url_cropped||im.image_url_small};
}

/* ---------- loading ---------- */
async function getJSON(url){
  for(let i=0;i<4;i++){
    try{
      const r=await fetch(url);
      if(r.status===400)return null;           // no cards of this type
      if(r.status===429){await sleep(1500);continue}
      if(!r.ok)throw new Error(r.status);
      return await r.json();
    }catch(e){await sleep(800*(i+1))}
  }
  throw new Error('Could not reach YGOPRODeck API');
}
let POOL=[],done=0;
async function loadType(t,seen){
  let off=0;
  while(true){
    const j=await getJSON(`${API}?type=${encodeURIComponent(t)}&format=tcg&num=100&offset=${off}`);
    if(!j||!j.data)break;
    for(const c of j.data)if(!seen.has(c.id))seen.set(c.id,slim(c));
    prog(seen.size);
    if(!j.meta||j.meta.next_page_offset==null)break;
    off=j.meta.next_page_offset;
    await sleep(120);
  }
}
function prog(n){
  $('#lt').textContent=`Loading monsters… ${n} cards · ${done}/${TYPES.length} card types`;
  $('#lb').style.width=(done/TYPES.length*100)+'%';
}
async function init(){
  $('#load').innerHTML='<div id="lt"></div><div class="bar"><i id="lb"></i></div>';
  done=0;prog(0);
  const seen=new Map(),q=[...TYPES];
  try{
    await Promise.all([1,2,3].map(async()=>{while(q.length){await loadType(q.shift(),seen);done++;prog(seen.size)}}));
  }catch(e){
    $('#load').innerHTML=`<p>${esc(e.message)}. Check your connection and try again.</p><button class="btn pri" id="retry">Retry</button>`;
    $('#retry').onclick=init;return;
  }
  POOL=[...seen.values()];
  buildFilters();
  $('#load').hidden=true;$('#game').hidden=false;
  newGame();
}

/* ---------- game ---------- */
let S;
const matches=c=>[...S.rev].every(k=>c[k]===S.t[k]);
function reveal(k,charge){if(S.rev.has(k))return;S.rev.add(k);if(charge)S.used++}
function randomHint(){
  const left=KEYS.filter(k=>!S.rev.has(k));
  if(!left.length||S.used>=5||S.over)return;
  reveal(left[Math.random()*left.length|0],true);render();
}
function newGame(){
  S={t:POOL[Math.random()*POOL.length|0],rev:new Set(),used:0,g:[],over:false,won:false};
  const k=KEYS[Math.random()*KEYS.length|0];reveal(k,true);
  $('#end').innerHTML='';render();
}
function cmp(k,g,t){
  if(g===t)return['g',''];
  if(k==='lv'||k==='atk'||k==='def'){
    if(g==null||t==null||g<0||t<0)return['r',''];
    const d=t-g;
    return[Math.abs(d)<=(k==='lv'?1:500)?'y':'r',d>0?'↑':'↓'];
  }
  return['r',''];
}
function submit(c){
  S.g.push(c);
  KEYS.forEach(k=>{if(c[k]===S.t[k])reveal(k,false)});   // exact matches are free
  if(c.id===S.t.id){S.over=S.won=true}
  else if(S.g.length>=6){S.over=true;KEYS.forEach(k=>reveal(k,false))}
  render();
}
const lvWord=c=>c.frame==='Link'?'Link ':c.frame==='XYZ'?'Rank ':'Lv ';
const stats=c=>`${c.frame} · ${c.attr} · ${esc(c.race)} · ${lvWord(c)}${c.lv} · ${fmt(c.atk)}/${fmt(c.def)}`;

function render(){
  const left=5-S.used;
  $('#stat').innerHTML=`<span>Guesses <b>${S.g.length}/6</b></span><span>Hints left <b>${left}</b></span><span>Possible <b>${POOL.filter(matches).length}</b></span>`;
  $('#hints').innerHTML=KEYS.map(k=>{
    const r=S.rev.has(k),can=!r&&!S.over&&left>0;
    return`<button class="h ${r?'on':''}" data-k="${k}" ${can?'':'disabled'}><small>${LBL[k]}</small><b>${r?fmt(S.t[k]):'?'}</b></button>`}).join('');
  const canHint=!S.over&&left>0&&KEYS.some(k=>!S.rev.has(k));
  $('#rnd').disabled=!canHint;$('#browse').disabled=S.over;
  $('#guesses').innerHTML=S.g.map(c=>`<div class="gr"><div class="gh"><img src="${c.art}" alt=""><span>${esc(c.name)}</span></div><div class="tiles">${
    KEYS.map(k=>{const[cl,ar]=cmp(k,c[k],S.t[k]);return`<div class="t ${cl}"><small>${LBL[k]}</small><b>${fmt(c[k])} ${ar}</b></div>`}).join('')}</div></div>`).join('');
  $('#end').innerHTML=S.over?`<div class="end"><h2>${S.won?`You got it in ${S.g.length}!`:'Out of guesses'}</h2>
    <img src="${S.t.img}" alt=""><div><b>${esc(S.t.name)}</b></div><small style="color:var(--mu)">${stats(S.t)}</small><br><br>
    <button class="btn pri" style="width:100%" id="again">Play again</button></div>`:'';
  if(S.over)$('#again').onclick=newGame;
}
$('#hints').onclick=e=>{const b=e.target.closest('.h');if(b&&!b.disabled){reveal(b.dataset.k,true);render()}};
$('#rnd').onclick=randomHint;

/* ---------- catalogue ---------- */
const cat={m:'match',q:'',fr:'',at:'',ra:'',lv:'',a1:'',a2:'',d1:'',d2:'',sort:'name',dir:1,res:[],n:0};
const rng=(v,lo,hi)=>{if(lo===''&&hi==='')return true;if(v==null||v<0)return false;return(lo===''||v>=+lo)&&(hi===''||v<=+hi)};
function opts(sel,arr,all){sel.innerHTML=`<option value="">${all}</option>`+arr.map(v=>`<option>${esc(v)}</option>`).join('')}
function buildFilters(){
  const u=k=>[...new Set(POOL.map(c=>c[k]))];
  opts($('#fr'),['Normal','Effect','Ritual','Fusion','Synchro','XYZ','Link'],'Any');
  opts($('#at'),u('attr').sort(),'Any');
  opts($('#ra'),u('race').sort(),'Any');
  opts($('#lvf'),u('lv').sort((a,b)=>a-b),'Any');
}
function runFilter(){
  const c=cat,q=c.q.trim().toLowerCase();
  let a=POOL.filter(x=>(c.m==='all'||matches(x))&&(!q||x.name.toLowerCase().includes(q))&&(!c.fr||x.frame===c.fr)&&(!c.at||x.attr===c.at)&&(!c.ra||x.race===c.ra)&&(c.lv===''||x.lv==c.lv)&&rng(x.atk,c.a1,c.a2)&&rng(x.def,c.d1,c.d2));
  const s=c.sort;
  a.sort((x,y)=>(s==='name'?x.name.localeCompare(y.name):(x[s]??-2)-(y[s]??-2)||x.name.localeCompare(y.name))*c.dir);
  c.res=a;c.n=0;
  $('#cnt').textContent=a.length+' cards';
  $('#list').innerHTML='';$('#list').scrollTop=0;
  if(!a.length)$('#list').innerHTML='<div class="empty">No cards match. Try clearing a filter or switching to All cards.</div>';
  more();
}
function more(){
  const c=cat,end=Math.min(c.n+60,c.res.length);let h='';
  for(let i=c.n;i<end;i++){const x=c.res[i];
    h+=`<div class="it ${S.g.some(g=>g.id===x.id)?'gd':''}" data-i="${i}"><img loading="lazy" src="${x.art}" alt=""><div><b>${esc(x.name)}</b><small>${stats(x)}</small></div></div>`}
  c.n=end;$('#list').insertAdjacentHTML('beforeend',h);
}
$('#list').onscroll=e=>{const l=e.target;if(l.scrollTop+l.clientHeight>l.scrollHeight-400&&cat.n<cat.res.length)more()};
$('#list').onclick=e=>{const it=e.target.closest('.it');if(it)confirmGuess(cat.res[+it.dataset.i])};
$('#browse').onclick=()=>{$('#cat').hidden=false;runFilter()};
$('#cx').onclick=()=>$('#cat').hidden=true;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));cat.m=b.dataset.m;runFilter()});
$('#ft').onclick=()=>$('#fl').hidden=!$('#fl').hidden;
$('#dir').onclick=()=>{cat.dir*=-1;$('#dir').textContent=cat.dir>0?'↑':'↓';runFilter()};
[['#q','q'],['#fr','fr'],['#at','at'],['#ra','ra'],['#lvf','lv'],['#a1','a1'],['#a2','a2'],['#d1','d1'],['#d2','d2'],['#sort','sort']]
  .forEach(([s,k])=>$(s).oninput=e=>{cat[k]=e.target.value;runFilter()});

function confirmGuess(c){
  const cf=$('#cf');
  cf.innerHTML=`<div class="box"><img src="${c.img}" alt=""><h3>${esc(c.name)}</h3><small>${stats(c)}</small>
    <div class="acts"><button class="btn" id="no">Cancel</button><button class="btn pri" id="yes">Guess this</button></div></div>`;
  cf.hidden=false;
  $('#no').onclick=()=>cf.hidden=true;
  $('#yes').onclick=()=>{cf.hidden=true;$('#cat').hidden=true;submit(c)};
}
init();
</script></body></html>
