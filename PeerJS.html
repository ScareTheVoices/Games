<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Nickname Chat</title>
  <script src="https://unpkg.com"></script>
</head>
<body>

  <!-- 1. Nickname & Connection Controls -->
  <div>
    <input id="nicknameInput" maxlength="20" placeholder="Your Nickname">
  </div>

  <div>
    <button onclick="hostRoom()">Host</button>
    <span id="roomCode"></span>
  </div>

  <div>
    <input id="joinCode" maxlength="5" placeholder="CODE" onkeydown="if(event.key==='Enter') joinRoom()">
    <button onclick="joinRoom()">Join</button>
    <button onclick="disconnectAll()">Disconnect</button>
  </div>

  <p id="status">Offline</p>
  <p>Online: <span id="userList">None</span></p>

  <hr>

  <!-- 2. Chat Log & Message Input -->
  <div id="chatLog" style="height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 8px;"></div>

  <div>
    <input id="msgInput" maxlength="500" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
    <button onclick="sendChat()">Send</button>
  </div>

  <script>
    const APP_PREFIX = 'p2p-chat-';
    const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    let peer = null;
    let role = null;        // 'host' | 'guest'
    let myName = '';
    let connections = [];   // Host: [{ conn, name }] | Guest: [{ conn, name }]

    function generateCode() {
      const bytes = new Uint8Array(5);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => ALPHABET[b % ALPHABET.length]).join('');
    }

    function getMyNickname() {
      const raw = document.getElementById('nicknameInput').value.trim();
      return raw ? raw.slice(0, 20) : 'User-' + Math.floor(100 + Math.random() * 900);
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function appendLine(text) {
      const log = document.getElementById('chatLog');
      const p = document.createElement('p');
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    function renderUserList(names) {
      document.getElementById('userList').textContent = names.length ? names.join(', ') : 'None';
    }

    function broadcastRoster() {
      if (role !== 'host') return;
      const names = [myName, ...connections.map(c => c.name)];
      renderUserList(names);
      connections.forEach(c => {
        if (c.conn.open) c.conn.send({ type: 'roster', names });
      });
    }

    // 1. HOST A ROOM
    function hostRoom() {
      disconnectAll();
      role = 'host';
      myName = getMyNickname();
      const code = generateCode();
      setStatus('Starting host...');

      peer = new Peer(APP_PREFIX + code);

      peer.on('open', () => {
        document.getElementById('roomCode').textContent = 'Room Code: ' + code;
        setStatus('Hosting');
        renderUserList([myName]);
        appendLine(`* Room ${code} created by ${myName}`);
      });

      peer.on('connection', conn => setupConnection(conn));
      peer.on('error', err => setStatus('Error: ' + err.type));
    }

    // 2. JOIN A ROOM (Sends nickname inside handshake metadata)
    function joinRoom() {
      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      if (code.length !== 5) return setStatus('Enter a 5-character code.');

      disconnectAll();
      role = 'guest';
      myName = getMyNickname();
      setStatus('Connecting...');

      peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(APP_PREFIX + code, {
          reliable: true,
          metadata: { name: myName }
        });
        setupConnection(conn);
      });

      peer.on('error', err => setStatus('Error: ' + err.type));
    }

    // 3. MANAGE DATA CHANNEL
    function setupConnection(conn) {
      const incomingName = (conn.metadata && conn.metadata.name)
        ? String(conn.metadata.name).slice(0, 20)
        : 'Guest';
      const entry = { conn, name: incomingName };

      const handleOpen = () => {
        if (connections.some(c => c.conn === conn)) return;
        connections.push(entry);
        setStatus('Connected');

        if (role === 'host') {
          const joinNotice = `* ${entry.name} joined`;
          appendLine(joinNotice);
          broadcastRoster();
          connections.forEach(c => {
            if (c.conn !== conn && c.conn.open) c.conn.send({ type: 'sys', text: joinNotice });
          });
        }
      };

      if (conn.open) handleOpen();
      else conn.on('open', handleOpen);

      conn.on('data', data => {
        if (!data || typeof data !== 'object') return;

        if (data.type === 'chat') {
          const sender = role === 'host' ? entry.name : String(data.sender || 'Peer');
          const text = String(data.text || '').slice(0, 500);
          appendLine(`${sender}: ${text}`);

          if (role === 'host') {
            connections.forEach(c => {
              if (c.conn !== conn && c.conn.open) {
                c.conn.send({ type: 'chat', sender: entry.name, text });
              }
            });
          }
        }

        if (data.type === 'sys') appendLine(String(data.text || ''));
        if (data.type === 'roster' && Array.isArray(data.names)) renderUserList(data.names);
      });

      conn.on('close', () => {
        connections = connections.filter(c => c.conn !== conn);
        if (role === 'host') {
          const leaveNotice = `* ${entry.name} left`;
          appendLine(leaveNotice);
          broadcastRoster();
          connections.forEach(c => {
            if (c.conn.open) c.conn.send({ type: 'sys', text: leaveNotice });
          });
        } else {
          setStatus('Host disconnected');
          renderUserList([]);
        }
      });
    }

    // 4. SEND CHAT MESSAGE
    function sendChat() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || connections.length === 0) return;
      input.value = '';

      appendLine(`${myName}: ${text}`);

      connections.forEach(c => {
        if (c.conn.open) {
          c.conn.send({ type: 'chat', sender: myName, text });
        }
      });
    }

    // 5. CLEANUP
    function disconnectAll() {
      connections.forEach(c => { try { c.conn.close(); } catch (e) {} });
      connections = [];
      try { if (peer) peer.destroy(); } catch (e) {}
      peer = null;
      role = null;
      document.getElementById('roomCode').textContent = '';
      renderUserList([]);
      setStatus('Offline');
    }
  </script>
</body>
</html>
