<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle Cheat</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--mute:#6b6a63;--card:#fff;--line:#d9d7cf;--g:#5a9a4a;--y:#d4a72c}
@media(prefers-color-scheme:dark){:root{--bg:#161715;--fg:#ecebe6;--mute:#9a988f;--card:#20211f;--line:#34352f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Georgia,serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:0 0 4px} h2{font-size:16px;margin:20px 0 2px}
.hint{margin:0 0 8px;color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.row input{width:100%;height:56px;text-align:center;font:700 22px Georgia,serif;text-transform:uppercase;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);padding:0}
#g input:not(:placeholder-shown){background:var(--g);border-color:var(--g);color:#fff}
#y input:not(:placeholder-shown){background:var(--y);border-color:var(--y);color:#fff;font-size:16px}
#x{width:100%;height:48px;font:600 20px Georgia,serif;text-transform:uppercase;letter-spacing:4px;padding:0 12px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
#status{margin:22px 0 10px;font-weight:700}
#out{display:flex;flex-wrap:wrap;gap:6px}
#out span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:17px;text-transform:uppercase;letter-spacing:1px}
button{margin-top:14px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 14px;font:inherit}
</style></head>
<body><main>
<h1>Wordle cheat</h1>
<h2>Right spot</h2><p class="hint">Green letters, in their position.</p>
<div class="row" id="g"></div>
<h2>Wrong spot</h2><p class="hint">Yellow letters, under the column where you guessed them.</p>
<div class="row" id="y"></div>
<h2>Not in the word</h2><p class="hint">Gray letters, no spaces needed.</p>
<input id="x" autocomplete="off" spellcheck="false">
<button id="reset" type="button">Clear all</button>
<div id="status">Loading dictionary…</div><div id="out"></div>
</main>
<script>
const SOURCES=[
 "https://raw.githubusercontent.com/tabatkins/wordle-list/main/words",
 "https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt"];
let WORDS=[];
const g=document.getElementById("g"),y=document.getElementById("y"),x=document.getElementById("x"),
      out=document.getElementById("out"),status=document.getElementById("status");
for(let i=0;i<5;i++){
 g.insertAdjacentHTML("beforeend",`<input maxlength="1" placeholder=" " autocomplete="off">`);
 y.insertAdjacentHTML("beforeend",`<input maxlength="4" placeholder=" " autocomplete="off">`);
}
const clean=s=>s.toLowerCase().replace(/[^a-z]/g,"");
async function load(){
 for(const url of SOURCES){
  try{
   const r=await fetch(url); if(!r.ok) continue;
   const t=await r.text();
   WORDS=[...new Set(t.split(/\s+/).map(w=>w.toLowerCase()).filter(w=>/^[a-z]{5}$/.test(w)))].sort();
   if(WORDS.length>500){run();return;}
  }catch(e){}
 }
 status.textContent="Couldn't load a dictionary. Check your internet connection.";
}
function run(){
 if(!WORDS.length) return;
 const green=[...g.children].map(i=>clean(i.value).slice(0,1));
 const yellow=[...y.children].map(i=>[...new Set(clean(i.value))]);
 const need=[...new Set(yellow.flat())];
 const known=new Set([...green.filter(Boolean),...need]);
 const banned=[...new Set(clean(x.value))].filter(c=>!known.has(c));
 const res=WORDS.filter(w=>{
  for(let i=0;i<5;i++){
   if(green[i]&&w[i]!==green[i]) return false;
   if(yellow[i].includes(w[i])) return false;
  }
  for(const c of need) if(!w.includes(c)) return false;
  for(const c of banned) if(w.includes(c)) return false;
  return true;
 });
 status.textContent=res.length+" word"+(res.length===1?"":"s")+" match"+(res.length>300?" (showing first 300)":"");
 out.replaceChildren(...res.slice(0,300).map(w=>{const s=document.createElement("span");s.textContent=w;return s;}));
}
for(const el of [...g.children,...y.children,x]) el.addEventListener("input",()=>{
 el.value=el.value.replace(/[^a-zA-Z]/g,"");
 if(g.contains(el)&&el.value&&el.nextElementSibling) el.nextElementSibling.focus();
 run();
});
document.getElementById("reset").onclick=()=>{for(const el of [...g.children,...y.children,x]) el.value="";run();};
load();
</script></body></html>
